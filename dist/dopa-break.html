<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>DOPA BREAK</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2305060d'/%3E%3Cpolygon points='32,8 56,32 32,56 8,32' fill='%234fd8ff'/%3E%3Ccircle cx='32' cy='32' r='9' fill='%23ff5aa8'/%3E%3C/svg%3E">
<style>
/* ==========================================================
   DOPA BREAK — UI
   スマホ縦持ち片手を最優先。数字はデカく、押す物は下に。
   ========================================================== */

:root{
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --cyan:#4fd8ff;
  --pink:#ff5aa8;
  --gold:#ffcf3f;
  --green:#7dff9b;
  --red:#ff4d4d;
  --font: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --num: "Arial Black", "Helvetica Neue", Impact, system-ui, sans-serif;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html,body{
  margin:0; padding:0; width:100%; height:100%;
  background:#05060d; color:#fff;
  font-family:var(--font);
  overflow:hidden; overscroll-behavior:none;
  touch-action:none;
  -webkit-user-select:none; user-select:none;
  -webkit-touch-callout:none;
}

#game{ position:fixed; inset:0; display:block; width:100%; height:100%; z-index:0; }

/* ---------- 共通オーバーレイ ---------- */
.overlay{
  position:fixed; inset:0; z-index:30;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  opacity:0; visibility:hidden; pointer-events:none;
  transition:opacity .18s ease, visibility .18s;
  padding: calc(var(--safe-t) + 12px) 14px calc(var(--safe-b) + 12px);
}
.overlay.on{ opacity:1; visibility:visible; pointer-events:auto; }

/* ==========================================================
   HUD
   ========================================================== */
.hud{
  position:fixed; inset:0; z-index:10; pointer-events:none;
  opacity:0; transition:opacity .2s;
  padding: calc(var(--safe-t) + 8px) 12px calc(var(--safe-b) + 8px);
  display:flex; flex-direction:column;
}
.hud.on{ opacity:1; }

.topbar{ display:flex; align-items:flex-start; gap:10px; }

.scorebox{ flex:1; min-width:0; }
.scorebox .lbl{
  font-size:10px; letter-spacing:.22em; opacity:.6; font-weight:800;
}
.score{
  font-family:var(--num); font-size:clamp(30px,9vw,46px); line-height:.98;
  text-shadow:0 0 18px rgba(79,216,255,.55), 0 3px 0 rgba(0,0,0,.6);
  font-variant-numeric:tabular-nums;
}
.best{ font-size:10px; opacity:.5; letter-spacing:.1em; font-weight:700; }

.timebox{ width:34%; max-width:170px; text-align:center; }
.timenum{
  font-family:var(--num); font-size:clamp(22px,6.5vw,32px); line-height:1;
  text-shadow:0 2px 0 rgba(0,0,0,.6);
}
.timenum.low{ color:var(--red); animation:pulse .5s infinite; }

.iconbtn{
  pointer-events:auto;
  width:38px; height:38px; border-radius:12px;
  background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16);
  color:#fff; font-size:17px; line-height:1; padding:0;
}

/* バー共通 */
.bar{
  position:relative; height:8px; border-radius:99px; overflow:hidden;
  background:rgba(255,255,255,.11); box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);
}
.bar .fill{
  position:absolute; inset:0; transform-origin:left center; border-radius:99px;
  transition:transform .08s linear;
}
.bar.time{ margin-top:4px; height:7px; }
.bar.time .fill{ background:linear-gradient(90deg,#7dff9b,#4fd8ff); }
.bar.time .fill.low{ background:linear-gradient(90deg,#ff4d4d,#ff8a3d); }

.hpwrap{ margin-top:8px; }
.bar.hp{ height:6px; }
.bar.hp .fill{ background:linear-gradient(90deg,#4fd8ff,#8fe9ff); box-shadow:0 0 12px rgba(79,216,255,.6); }
.bar.hp .fill.low{ background:linear-gradient(90deg,#ff4d4d,#ff8a3d); box-shadow:0 0 14px rgba(255,77,77,.7); }

/* ---------- コンボ ---------- */
.combo{
  position:absolute; left:0; right:0; top:calc(var(--safe-t) + 15%);
  display:flex; flex-direction:column; align-items:center;
  opacity:0; transform:scale(.8); transition:opacity .12s, transform .12s;
  --cc:#fff; --ct:1;
}
.combo.on{ opacity:1; transform:scale(1); }
.cnum{
  font-family:var(--num); font-size:clamp(46px,17vw,88px); line-height:.9;
  color:var(--cc);
  text-shadow:0 0 26px var(--cc), 0 4px 0 rgba(0,0,0,.55);
  font-variant-numeric:tabular-nums;
}
.cnum.pop{ animation:cpop .18s cubic-bezier(.2,1.6,.4,1); }
@keyframes cpop{ 0%{ transform:scale(1.45) } 100%{ transform:scale(1) } }
.cmul{
  font-family:var(--num); font-size:clamp(18px,5.5vw,28px); color:var(--cc);
  text-shadow:0 0 14px var(--cc), 0 2px 0 rgba(0,0,0,.6); margin-top:-4px;
}
.ctimer{
  margin-top:6px; width:76px; height:4px; border-radius:99px; background:rgba(255,255,255,.14); overflow:hidden;
}
.ctimer i{
  display:block; height:100%; width:100%; background:var(--cc);
  transform:scaleX(var(--ct)); transform-origin:left center;
}

/* ---------- イベント予告 / バナー ---------- */
.warn{
  position:absolute; left:0; right:0; top:calc(var(--safe-t) + 78px);
  display:flex; justify-content:center; align-items:center; gap:10px;
  opacity:0; transition:opacity .15s; --wc:#fff;
}
.warn.on{ opacity:1; }
.warn .wl{
  font-family:var(--num); font-size:clamp(15px,4.4vw,22px); color:var(--wc);
  text-shadow:0 0 16px var(--wc), 0 2px 0 #000;
}
.warn .wn{
  font-family:var(--num); font-size:clamp(20px,6vw,30px); color:#fff;
  background:var(--wc); color:#08101c; border-radius:10px; padding:0 10px;
}
.warn.tick{ animation:warnpop .35s ease; }
@keyframes warnpop{ 0%{ transform:scale(1.25) } 100%{ transform:scale(1) } }

.banner{
  position:absolute; left:0; right:0; top:calc(var(--safe-t) + 30%);
  text-align:center; opacity:0; --bc:#fff; pointer-events:none;
}
.banner.on{ animation:bann 1.6s ease forwards; }
@keyframes bann{
  0%{ opacity:0; transform:scale(.6) }
  12%{ opacity:1; transform:scale(1.12) }
  22%{ transform:scale(1) }
  75%{ opacity:1; transform:scale(1) }
  100%{ opacity:0; transform:scale(1.05) }
}
.banner .bt{
  font-family:var(--num); font-size:clamp(30px,10vw,54px); color:var(--bc);
  text-shadow:0 0 30px var(--bc), 0 4px 0 rgba(0,0,0,.6); letter-spacing:.02em;
}
.banner .bs{ font-size:13px; font-weight:800; opacity:.85; margin-top:2px; }

/* ---------- 下段 (LV / FEVER) ---------- */
.bottom{ margin-top:auto; display:flex; flex-direction:column; gap:7px; }
.row{ display:flex; align-items:center; gap:8px; }
.lvnum{
  font-family:var(--num); font-size:15px; min-width:52px;
  text-shadow:0 0 12px rgba(125,255,155,.6);
}
.bar.xp{ flex:1; height:12px; }
.bar.xp .fill{ background:linear-gradient(90deg,#7dff9b,#4fd8ff); box-shadow:0 0 14px rgba(125,255,155,.65); }

.fevlabel{
  font-family:var(--num); font-size:13px; min-width:52px; opacity:.75; letter-spacing:.04em;
}
.bar.fever{ flex:1; height:9px; }
.bar.fever .fill{ background:linear-gradient(90deg,#ff8a3d,#ff5aa8,#c07bff); }
.feverrow.near .fevlabel{ opacity:1; color:var(--pink); animation:pulse .55s infinite; }
.feverrow.near .bar.fever{ box-shadow:0 0 16px rgba(255,90,168,.7); }
.feverrow.active .fevlabel{ color:#ff7fe0; opacity:1; animation:pulse .28s infinite; }
.feverrow.active .bar.fever .fill{ background:linear-gradient(90deg,#fff,#ff7fe0,#fff); }

@keyframes pulse{ 0%,100%{ transform:scale(1) } 50%{ transform:scale(1.12) } }

/* ==========================================================
   TITLE
   ========================================================== */
/* タイトルは画面のどこを触っても即スタートさせたいので、入力は canvas に素通しする */
.title{ background:radial-gradient(circle at 50% 45%, rgba(10,20,40,.55), rgba(3,4,10,.86)); }
.overlay.title.on{ pointer-events:none; }
.logo{ display:flex; flex-direction:column; align-items:center; line-height:.85; }
.logo .l1{
  font-family:var(--num); font-size:clamp(44px,15vw,84px);
  background:linear-gradient(180deg,#fff,#4fd8ff);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 0 22px rgba(79,216,255,.7));
  letter-spacing:.02em;
}
.logo .l2{
  font-family:var(--num); font-size:clamp(52px,18vw,100px);
  background:linear-gradient(180deg,#fff,#ff5aa8);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 0 26px rgba(255,90,168,.75));
  letter-spacing:.02em;
  animation:logofloat 2.4s ease-in-out infinite;
}
@keyframes logofloat{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-6px) } }
.tagline{ margin-top:10px; font-size:13px; font-weight:800; opacity:.72; letter-spacing:.08em; }

.tapzone{ margin-top:44px; position:relative; display:flex; flex-direction:column; align-items:center; }
.tapring{
  position:absolute; top:-14px; width:118px; height:118px; border-radius:50%;
  border:3px solid rgba(79,216,255,.85); animation:tapring 1.5s ease-out infinite;
}
.tapring::after{
  content:''; position:absolute; inset:-3px; border-radius:50%;
  border:3px solid rgba(255,90,168,.6); animation:tapring 1.5s ease-out .5s infinite;
}
@keyframes tapring{
  0%{ transform:scale(.55); opacity:1 }
  100%{ transform:scale(1.5); opacity:0 }
}
.taphand{ font-size:52px; animation:tapdown .95s ease-in-out infinite; }
@keyframes tapdown{
  0%,100%{ transform:translateY(-8px) scale(1) }
  50%{ transform:translateY(6px) scale(.9) }
}
.taptext{
  margin-top:18px; font-family:var(--num); font-size:clamp(20px,6vw,28px);
  text-shadow:0 0 20px rgba(79,216,255,.8); animation:pulse 1.1s infinite;
}
.taphint{ margin-top:8px; font-size:12px; font-weight:700; opacity:.6; }

.titlestats{
  position:absolute; bottom:calc(var(--safe-b) + 22px);
  display:flex; gap:18px; font-size:12px; font-weight:800; opacity:.7; letter-spacing:.06em;
}

/* ==========================================================
   LEVEL UP
   ========================================================== */
.levelup{
  background:rgba(3,6,14,.72);
  backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
  justify-content:flex-end;
}
.lvtitle{
  font-family:var(--num); font-size:clamp(28px,9vw,46px);
  background:linear-gradient(180deg,#fff,#7dff9b);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 0 20px rgba(125,255,155,.75));
  margin-bottom:14px;
  animation:lvin .3s cubic-bezier(.2,1.5,.4,1);
}
.levelup.legend .lvtitle{
  background:linear-gradient(180deg,#fff,#ffc93f);
  -webkit-background-clip:text; background-clip:text;
  filter:drop-shadow(0 0 26px rgba(255,201,63,.95));
}
@keyframes lvin{ 0%{ transform:scale(.4); opacity:0 } 100%{ transform:scale(1); opacity:1 } }

.cards{ width:100%; max-width:460px; display:flex; flex-direction:column; gap:10px; }
.card{
  position:relative; display:flex; align-items:center; gap:12px;
  width:100%; padding:13px 14px; border-radius:16px; text-align:left;
  background:linear-gradient(135deg, rgba(255,255,255,.09), rgba(255,255,255,.03));
  border:2px solid var(--rc); color:#fff; font-family:var(--font);
  box-shadow:0 0 22px var(--rg), inset 0 0 26px rgba(255,255,255,.05);
  animation:cardin .28s cubic-bezier(.2,1.4,.4,1) backwards;
  overflow:hidden;
}
@keyframes cardin{ 0%{ transform:translateY(26px) scale(.92); opacity:0 } 100%{ transform:none; opacity:1 } }
.card.picked{ animation:cardpick .12s ease forwards; }
@keyframes cardpick{ to{ transform:scale(.94); filter:brightness(2.2) } }

.crar{
  position:absolute; top:0; right:0; padding:3px 9px 4px;
  font-size:9px; font-weight:900; letter-spacing:.16em;
  background:var(--rc); color:#08101c; border-radius:0 12px 0 12px;
}
.cicon{ font-size:34px; width:46px; text-align:center; flex:none; filter:drop-shadow(0 0 8px var(--rg)); }
.cbody{ flex:1; min-width:0; }
.cname{
  font-family:var(--num); font-size:clamp(17px,5vw,22px); color:var(--rc);
  text-shadow:0 0 12px var(--rg); line-height:1.05;
}
.cdesc{ font-size:12.5px; font-weight:700; opacity:.88; margin-top:3px; line-height:1.3; }

.card.r-LEGENDARY{
  animation:cardin .28s cubic-bezier(.2,1.4,.4,1) backwards, legpulse 1s ease-in-out infinite;
  background:linear-gradient(135deg, rgba(255,201,63,.22), rgba(255,120,40,.08));
}
@keyframes legpulse{
  0%,100%{ box-shadow:0 0 22px rgba(255,201,63,.6), inset 0 0 30px rgba(255,201,63,.12) }
  50%{ box-shadow:0 0 44px rgba(255,201,63,1), inset 0 0 44px rgba(255,201,63,.3) }
}
.card.r-LEGENDARY .cglow{
  position:absolute; inset:-40%; background:conic-gradient(from 0deg, transparent, rgba(255,220,120,.35), transparent 40%);
  animation:spin 2.2s linear infinite; pointer-events:none;
}
@keyframes spin{ to{ transform:rotate(1turn) } }
.card.r-EPIC{ background:linear-gradient(135deg, rgba(192,123,255,.18), rgba(255,255,255,.03)); }

.lvhint{ margin-top:12px; margin-bottom:4px; font-size:12px; font-weight:800; opacity:.55; letter-spacing:.14em; }

/* ==========================================================
   RESULT
   ========================================================== */
.result{
  background:radial-gradient(circle at 50% 30%, rgba(20,10,40,.8), rgba(3,4,10,.94));
  justify-content:flex-start; overflow-y:auto;
}
.rtop{ text-align:center; margin-top:6px; }
.rlabel{ font-size:11px; letter-spacing:.28em; opacity:.6; font-weight:800; }
.rscore{
  font-family:var(--num); font-size:clamp(44px,15vw,76px); line-height:1;
  background:linear-gradient(180deg,#fff,#4fd8ff);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 0 24px rgba(79,216,255,.7));
  font-variant-numeric:tabular-nums;
  animation:lvin .35s cubic-bezier(.2,1.5,.4,1);
}
.rhook{ margin-top:6px; font-size:14px; font-weight:900; opacity:.9; }
.rhook.best{ color:var(--gold); font-size:18px; animation:pulse .8s infinite; text-shadow:0 0 18px rgba(255,201,63,.8); }
.rhook.close{ color:var(--pink); text-shadow:0 0 14px rgba(255,90,168,.7); }
.rbest{ margin-top:4px; font-size:11px; opacity:.55; font-weight:800; letter-spacing:.1em; }

.rgrid{
  margin-top:14px; width:100%; max-width:460px;
  display:grid; grid-template-columns:1fr 1fr; gap:8px;
}
.rcell{
  position:relative; padding:9px 10px; border-radius:13px;
  background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1);
}
.rcell.new{ border-color:var(--gold); box-shadow:0 0 18px rgba(255,201,63,.5); }
.rk{ font-size:9.5px; letter-spacing:.16em; opacity:.6; font-weight:800; }
.rv{ font-family:var(--num); font-size:clamp(20px,6vw,28px); line-height:1.1; }
.rnew{
  position:absolute; top:-7px; right:-4px; background:var(--gold); color:#08101c;
  font-size:9px; font-weight:900; padding:2px 6px; border-radius:8px;
  animation:pulse .7s infinite;
}

.shopwrap{ width:100%; max-width:460px; margin-top:14px; }
.shophead{
  display:flex; justify-content:space-between; align-items:center;
  font-size:11px; font-weight:900; letter-spacing:.14em; opacity:.7; margin-bottom:6px;
}
.shopcoins{ color:var(--gold); opacity:1; font-size:13px; }
.shop{ display:flex; flex-direction:column; gap:6px; }
.shopitem{
  display:flex; align-items:center; gap:10px; width:100%; padding:8px 10px;
  border-radius:12px; background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1); color:#fff; text-align:left;
  font-family:var(--font); opacity:.65;
}
.shopitem.can{ opacity:1; border-color:var(--gold); box-shadow:0 0 14px rgba(255,201,63,.32); }
.shopitem.maxed{ opacity:.45; }
.si-icon{ font-size:22px; width:28px; text-align:center; flex:none; }
.si-main{ flex:1; min-width:0; }
.si-name{ font-family:var(--num); font-size:14px; }
.si-desc{ font-size:10.5px; font-weight:700; opacity:.7; }
.si-dots{ display:flex; gap:3px; margin-top:4px; }
.si-dots i{ width:14px; height:4px; border-radius:99px; background:rgba(255,255,255,.18); }
.si-dots i.on{ background:var(--gold); box-shadow:0 0 6px rgba(255,201,63,.8); }
.si-cost{ font-family:var(--num); font-size:13px; color:var(--gold); flex:none; }

.rbtns{
  width:100%; max-width:460px; margin-top:16px; margin-bottom:6px;
  display:flex; flex-direction:column; gap:8px; align-items:center;
}
.retry{
  width:100%; padding:19px 0; border:none; border-radius:18px;
  font-family:var(--num); font-size:clamp(24px,7vw,32px); letter-spacing:.06em;
  color:#06111f; background:linear-gradient(180deg,#8fe9ff,#33c8ff);
  box-shadow:0 0 34px rgba(79,216,255,.75), 0 6px 0 #1a7fa8;
  animation:pulse 1.3s infinite;
}
.retry:active{ transform:translateY(4px); box-shadow:0 0 34px rgba(79,216,255,.75), 0 2px 0 #1a7fa8; }
.totitle{
  padding:8px 22px; border-radius:12px; background:transparent;
  border:1px solid rgba(255,255,255,.22); color:rgba(255,255,255,.65);
  font-size:12px; font-weight:800; letter-spacing:.14em; font-family:var(--font);
}

/* 横持ち・広い画面 */
@media (min-width:640px) and (orientation:landscape){
  .cards{ flex-direction:row; max-width:840px; }
  .card{ flex-direction:column; text-align:center; align-items:center; padding:16px 12px; }
  .cbody{ text-align:center; }
  .rgrid{ grid-template-columns:repeat(4,1fr); max-width:840px; }
  .shopwrap,.rbtns{ max-width:840px; }
  .shop{ display:grid; grid-template-columns:1fr 1fr; }
}

</style>
</head>
<body>
<canvas id="game"></canvas>

<!-- ============ HUD ============ -->
<div id="hud" class="hud">
  <div class="topbar">
    <div class="scorebox">
      <div class="lbl">SCORE</div>
      <div id="score" class="score">0</div>
      <div id="best" class="best"></div>
    </div>
    <div class="timebox">
      <div id="timeNum" class="timenum">60</div>
      <div class="bar time"><div id="timeFill" class="fill"></div></div>
    </div>
    <button id="mute" class="iconbtn" aria-label="sound">🔊</button>
  </div>

  <div class="hpwrap">
    <div class="bar hp"><div id="hpFill" class="fill"></div></div>
  </div>

  <div id="warn" class="warn"></div>
  <div id="banner" class="banner"></div>

  <div id="comboWrap" class="combo">
    <div id="comboNum" class="cnum">0</div>
    <div id="comboMul" class="cmul">x1</div>
    <div class="ctimer"><i></i></div>
  </div>

  <div class="bottom">
    <div class="row lvrow">
      <span id="lvNum" class="lvnum">LV 1</span>
      <div class="bar xp"><div id="xpFill" class="fill"></div></div>
    </div>
    <div id="feverRow" class="row feverrow">
      <span id="feverLabel" class="fevlabel">FEVER</span>
      <div class="bar fever"><div id="feverFill" class="fill"></div></div>
    </div>
  </div>
</div>

<!-- ============ TITLE ============ -->
<div id="title" class="overlay title">
  <div class="logo">
    <span class="l1">DOPA</span><span class="l2">BREAK</span>
  </div>
  <div class="tagline">60秒。壊せるだけ壊せ。</div>

  <div class="tapzone">
    <div class="tapring"></div>
    <div class="taphand">👆</div>
    <div class="taptext">TAP TO START</div>
    <div class="taphint">押しっぱなしで連射／指を動かして狙う</div>
  </div>

  <div class="titlestats">
    <span id="titleBest">BEST 0</span>
    <span id="titleCoins">🪙 0</span>
  </div>
</div>

<!-- ============ LEVEL UP ============ -->
<div id="levelup" class="overlay levelup">
  <div id="lvTitle" class="lvtitle">LEVEL UP!</div>
  <div id="cards" class="cards"></div>
  <div class="lvhint">1つ選べ</div>
</div>

<!-- ============ RESULT ============ -->
<div id="result" class="overlay result">
  <div class="rtop">
    <div class="rlabel">SCORE</div>
    <div id="rScore" class="rscore">0</div>
    <div id="rHook" class="rhook"></div>
    <div id="rBest" class="rbest"></div>
  </div>

  <div id="rGrid" class="rgrid"></div>

  <div class="shopwrap">
    <div class="shophead">

(() => {
'use strict';

/* ===== src/rng.js ===== */
const rand = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const chance = (p) => Math.random() < p;
const pick = (arr) => arr[(Math.random() * arr.length) | 0];

function weighted(items, getW = (o) => o.w) {
  let total = 0;
  for (const it of items) total += getW(it);
  let r = Math.random() * total;
  for (const it of items) {
    r -= getW(it);
    if (r <= 0) return it;
  }
  return items[items.length - 1];
}

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;

/* ===== src/config.js ===== */

/* ===== src/audio.js ===== */
// ============================================================
// WebAudio 合成SE（音声素材ゼロで成立させる）
// コンボが上がるほどキル音のピッチが上がっていく = ドーパミンの本体
// ============================================================

const NOTES = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26, 28, 31, 33, 36];

class AudioEngine {
  constructor() {
    this.ctx = null;
    this.master = null;
    this.muted = false;
    this.ready = false;
    this._noise = null;
    this._last = new Map();
  }

  init() {
    if (this.ready) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.55;

    // 全体を軽く潰して「デカい音」に聞かせる
    const comp = this.ctx.createDynamicsCompressor();
    comp.threshold.value = -18;
    comp.knee.value = 20;
    comp.ratio.value = 8;
    comp.attack.value = 0.002;
    comp.release.value = 0.14;
    this.master.connect(comp).connect(this.ctx.destination);

    // ノイズバッファ（爆発用）
    const len = this.ctx.sampleRate * 1.0;
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this._noise = buf;

    this.ready = true;
  }

  resume() {
    this.init();
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  }

  setMuted(m) {
    this.muted = m;
    if (this.master) this.master.gain.value = m ? 0 : 0.55;
  }

  get t() { return this.ctx.currentTime; }

  _ok(key, minGap = 0) {
    if (!this.ready || this.muted) return false;
    if (minGap) {
      const now = this.ctx.currentTime;
      if ((this._last.get(key) || -9) + minGap > now) return false;
      this._last.set(key, now);
    }
    return true;
  }

  _osc(type, freq, t0, dur, gain, { to = null, curve = 'exp', pan = 0 } = {}) {
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (to !== null) {
      if (curve === 'exp') o.frequency.exponentialRampToValueAtTime(Math.max(20, to), t0 + dur);
      else o.frequency.linearRampToValueAtTime(Math.max(20, to), t0 + dur);
    }
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    let node = g;
    if (pan && this.ctx.createStereoPanner) {
      const p = this.ctx.createStereoPanner();
      p.pan.value = Math.max(-1, Math.min(1, pan));
      g.connect(p); node = p;
    }
    o.connect(g); node.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.03);
    return o;
  }

  _noiseHit(t0, dur, gain, f0, f1, q = 1) {
    const s = this.ctx.createBufferSource();
    s.buffer = this._noise;
    s.playbackRate.value = 0.8 + Math.random() * 0.4;
    const f = this.ctx.createBiquadFilter();
    f.type = 'lowpass';
    f.Q.value = q;
    f.frequency.setValueAtTime(f0, t0);
    f.frequency.exponentialRampToValueAtTime(Math.max(60, f1), t0 + dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(gain, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f).connect(g).connect(this.master);
    s.start(t0); s.stop(t0 + dur + 0.02);
  }

  // ---- SE ----

  shoot(pitch = 1) {
    if (!this._ok('shoot', 0.035)) return;
    const t = this.t;
    this._osc('square', 620 * pitch, t, 0.055, 0.06, { to: 200 * pitch });
    this._noiseHit(t, 0.05, 0.05, 2600, 500);
  }

  boom(power = 1) {
    if (!this._ok('boom', 0.028)) return;
    const t = this.t;
    const p = Math.min(2.4, power);
    this._noiseHit(t, 0.16 + p * 0.09, 0.16 * p, 1400 + p * 900, 90, 1.2);
    this._osc('sine', 150 * (1 / (0.7 + p * 0.3)), t, 0.2 + p * 0.1, 0.24 * p, { to: 38 });
  }

  kill(comboIndex = 0, crit = false) {
    if (!this._ok('kill', 0.012)) return;
    const t = this.t;
    const semi = NOTES[Math.min(NOTES.length - 1, comboIndex)];
    const f = 330 * Math.pow(2, semi / 12);
    this._osc(crit ? 'sawtooth' : 'triangle', f, t, crit ? 0.13 : 0.075, crit ? 0.13 : 0.075, { to: f * 2.1 });
    if (crit) this._osc('square', f * 2, t + 0.01, 0.1, 0.06, { to: f * 3 });
  }

  coin() {
    if (!this._ok('coin', 0.03)) return;
    const t = this.t;
    this._osc('square', 1180, t, 0.05, 0.05);
    this._osc('square', 1760, t + 0.045, 0.09, 0.05);
  }

  hurt() {
    if (!this._ok('hurt', 0.1)) return;
    const t = this.t;
    this._osc('sawtooth', 210, t, 0.22, 0.14, { to: 55 });
    this._noiseHit(t, 0.2, 0.1, 700, 100);
  }

  levelup() {
    if (!this._ok('lv')) return;
    const t = this.t;
    [0, 4, 7, 12].forEach((s, i) => {
      this._osc('triangle', 440 * Math.pow(2, s / 12), t + i * 0.045, 0.26, 0.12);
    });
  }

  legendary() {
    if (!this._ok('leg')) return;
    const t = this.t;
    [0, 7, 12, 16, 19, 24].forEach((s, i) => {
      this._osc('sawtooth', 220 * Math.pow(2, s / 12), t + i * 0.06, 0.9, 0.09, { to: 220 * Math.pow(2, (s + 12) / 12) });
    });
    this._noiseHit(t, 0.9, 0.1, 400, 6000, 3);
  }

  pickup(rarityIdx = 0) {
    if (!this._ok('pick')) return;
    const t = this.t;
    const base = 520 + rarityIdx * 90;
    this._osc('square', base, t, 0.08, 0.1);
    this._osc('square', base * 1.5, t + 0.06, 0.16, 0.09);
  }

  event(kind = 0) {
    if (!this._ok('ev')) return;
    const t = this.t;
    this._osc('sawtooth', 300 + kind * 40, t, 0.5, 0.11, { to: 900 + kind * 60 });
    this._osc('square', 150, t, 0.5, 0.08, { to: 450 });
  }

  warn() {
    if (!this._ok('warn', 0.2)) return;
    const t = this.t;
    this._osc('square', 880, t, 0.09, 0.07);
    this._osc('square', 660, t + 0.1, 0.09, 0.06);
  }

  jackpot() {
    if (!this._ok('jack')) return;
    const t = this.t;
    for (let i = 0; i < 12; i++) {
      this._osc('square', 500 * Math.pow(2, (i * 2) / 12), t + i * 0.035, 0.2, 0.07);
    }
  }

  gameover() {
    if (!this._ok('go')) return;
    const t = this.t;
    [0, -3, -7, -12].forEach((s, i) => {
      this._osc('triangle', 400 * Math.pow(2, s / 12), t + i * 0.13, 0.55, 0.12);
    });
  }

  start() {
    if (!this._ok('start')) return;
    const t = this.t;
    [0, 7, 12].forEach((s, i) => this._osc('square', 330 * Math.pow(2, s / 12), t + i * 0.05, 0.2, 0.1));
  }
}

const SFX = new AudioEngine();

function vibrate(pattern) {
  if (navigator.vibrate) { try { navigator.vibrate(pattern); } catch (e) { /* noop */ } }
}

/* ===== src/fx.js ===== */
// ============================================================
// Juice レイヤー
// 粒子 / 画面振動 / ヒットストップ / スローモー / フラッシュ /
// 数字ポップ / 衝撃波リング / 落雷 / 破片
// ゲーム性より先に、まずここを気持ちよくする
// ============================================================



class FX {
  constructor() {
    this.parts = [];
    this.texts = [];
    this.rings = [];
    this.bolts = [];
    this.shake = 0;
    this.shakeAng = 0;
    this.hitstop = 0;
    this.slow = 0;         // 残り秒
    this.slowScale = 1;
    this.flash = { a: 0, color: '#fff' };
    this.chroma = 0;       // 色収差っぽい演出量
    this.zoom = 0;         // カメラのズームパンチ
    this.w = 0; this.h = 0;
  }

  setBounds(w, h) { this.w = w; this.h = h; }

  /** 大きい快感のときだけ画面が「寄る」 */
  zoomPunch(a) { this.zoom = Math.min(0.14, this.zoom + a); }
  get zoomScale() { return 1 + this.zoom; }

  reset() {
    this.parts.length = 0;
    this.texts.length = 0;
    this.rings.length = 0;
    this.bolts.length = 0;
    this.shake = 0; this.hitstop = 0; this.slow = 0; this.flash.a = 0; this.chroma = 0; this.zoom = 0;
  }

  // ---- 追加API ----
  addShake(amount) { this.shake = Math.min(46, this.shake + amount); this.shakeAng = rand(TAU); }
  addHitstop(sec) { this.hitstop = Math.max(this.hitstop, sec); }
  addSlow(sec, scale = 0.25) { this.slow = Math.max(this.slow, sec); this.slowScale = scale; }
  addFlash(color, a = 0.35) { if (a > this.flash.a) { this.flash.a = a; this.flash.color = color; } }
  addChroma(v) { this.chroma = Math.min(14, this.chroma + v); }

  burst(x, y, n, opts = {}) {
    const {
      color = '#fff', speed = 260, spread = TAU, dir = 0,
      life = 0.5, size = 3, grav = 0, shrink = 1, glow = true, drag = 2.2,
    } = opts;
    const room = CFG.fx.maxParticles - this.parts.length;
    n = Math.min(n, Math.max(0, room));
    for (let i = 0; i < n; i++) {
      const a = dir + rand(-spread / 2, spread / 2);
      const s = speed * rand(0.35, 1.25);
      this.parts.push({
        x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: life * rand(0.6, 1.3), max: life, color, size: size * rand(0.6, 1.5),
        grav, shrink, glow, drag, rot: rand(TAU), vr: rand(-9, 9),
        shape: opts.shape || 'spark',
      });
    }
  }

  shards(x, y, n, color, sides = 4, size = 5) {
    this.burst(x, y, n, { color, speed: 300, life: 0.7, size, grav: 420, shape: 'shard', drag: 1.1 });
  }

  text(x, y, str, opts = {}) {
    const { color = '#fff', size = 22, life = 0.8, vy = -70, bold = true, shadow = true, scale = 1.35 } = opts;
    // 画面外に出た数字は「見えない報酬」= 無意味なので必ず画面内に収める。
    // 出現直後は scale 倍に膨らむうえ、画面振動とズームでさらに外へ寄るので余裕を持たせる
    if (this.w) {
      const half = str.length * size * scale * 0.32;
      const pad = Math.min(this.w * 0.45, half + 26);
      x = clamp(x, pad, this.w - pad);
      y = clamp(y, 46, this.h - 46);
    }
    if (this.texts.length > 34) this.texts.shift();
    this.texts.push({ x, y, str, color, size, life, max: life, vy, bold, shadow, scale, t: 0 });
  }

  ring(x, y, r, opts = {}) {
    const { color = '#fff', life = 0.4, width = 4, grow = 2.6, fill = 0 } = opts;
    this.rings.push({ x, y, r0: r * 0.25, r, color, life, max: life, width, grow, fill });
  }

  bolt(x1, y1, x2, y2, color = '#bfe9ff', life = 0.22) {
    const pts = [];
    const seg = 9;
    for (let i = 0; i <= seg; i++) {
      const t = i / seg;
      const off = i === 0 || i === seg ? 0 : rand(-26, 26);
      const nx = -(y2 - y1), ny = x2 - x1;
      const len = Math.hypot(nx, ny) || 1;
      pts.push({ x: x1 + (x2 - x1) * t + (nx / len) * off, y: y1 + (y2 - y1) * t + (ny / len) * off });
    }
    this.bolts.push({ pts, life, max: life, color });
  }

  // ---- 更新 ----
  update(dt) {
    // 粒子
    for (let i = this.parts.length - 1; i >= 0; i--) {
      const p = this.parts[i];
      p.life -= dt;
      if (p.life <= 0) { this.parts.splice(i, 1); continue; }
      p.vy += p.grav * dt;
      const d = Math.max(0, 1 - p.drag * dt);
      p.vx *= d; p.vy *= d;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.rot += p.vr * dt;
    }
    for (let i = this.texts.length - 1; i >= 0; i--) {
      const t = this.texts[i];
      t.life -= dt; t.t += dt;
      t.y += t.vy * dt; t.vy *= Math.max(0, 1 - 2.6 * dt);
      if (t.life <= 0) this.texts.splice(i, 1);
    }
    for (let i = this.rings.length - 1; i >= 0; i--) {
      const r = this.rings[i];
      r.life -= dt;
      if (r.life <= 0) this.rings.splice(i, 1);
    }
    for (let i = this.bolts.length - 1; i >= 0; i--) {
      const b = this.bolts[i];
      b.life -= dt;
      if (b.life <= 0) this.bolts.splice(i, 1);
    }

    this.shake = Math.max(0, this.shake - this.shake * CFG.fx.shakeDecay * dt - 12 * dt);
    this.flash.a = Math.max(0, this.flash.a - dt * 2.6);
    this.chroma = Math.max(0, this.chroma - dt * 22);
    this.zoom = Math.max(0, this.zoom - this.zoom * 7 * dt - 0.06 * dt);
  }

  shakeOffset() {
    if (this.shake < 0.2) return { x: 0, y: 0 };
    this.shakeAng += 2.1;
    return {
      x: Math.cos(this.shakeAng) * this.shake * rand(0.5, 1),
      y: Math.sin(this.shakeAng * 1.7) * this.shake * rand(0.5, 1),
    };
  }

  // ---- 描画 ----
  drawWorld(ctx) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    // リング
    for (const r of this.rings) {
      const t = 1 - r.life / r.max;
      const rad = r.r0 + (r.r * r.grow - r.r0) * (1 - Math.pow(1 - t, 2.4));
      const a = Math.pow(1 - t, 1.6);
      ctx.globalAlpha = a;
      ctx.strokeStyle = r.color;
      ctx.lineWidth = r.width * (1 - t * 0.75) + 0.6;
      ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, TAU); ctx.stroke();
      if (r.fill) {
        ctx.globalAlpha = a * r.fill;
        ctx.fillStyle = r.color;
        ctx.fill();
      }
    }

    // 雷
    for (const b of this.bolts) {
      const a = b.life / b.max;
      ctx.globalAlpha = a;
      ctx.strokeStyle = b.color;
      ctx.lineCap = 'round';
      for (const w of [11, 4.5, 1.6]) {
        ctx.lineWidth = w * a;
        ctx.beginPath();
        ctx.moveTo(b.pts[0].x, b.pts[0].y);
        for (let i = 1; i < b.pts.length; i++) ctx.lineTo(b.pts[i].x, b.pts[i].y);
        ctx.stroke();
      }
    }

    // 粒子
    for (const p of this.parts) {
      const a = clamp(p.life / p.max, 0, 1);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      const s = p.size * (p.shrink ? a : 1);
      if (p.shape === 'shard') {
        ctx.save();
        ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillRect(-s, -s * 0.6, s * 2, s * 1.2);
        ctx.restore();
      } else if (p.shape === 'ring') {
        ctx.strokeStyle = p.color; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(p.x, p.y, s * 2, 0, TAU); ctx.stroke();
      } else {
        const st = Math.hypot(p.vx, p.vy) * 0.012;
        if (st > 1.2) {
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(Math.atan2(p.vy, p.vx));
          ctx.fillRect(-s * st, -s * 0.5, s * st * 2, s);
          ctx.restore();
        } else {
          ctx.beginPath(); ctx.arc(p.x, p.y, s, 0, TAU); ctx.fill();
        }
      }
    }
    ctx.restore();
  }

  drawTexts(ctx) {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const t of this.texts) {
      const k = 1 - t.life / t.max;
      // 出た瞬間デカく → すぐ縮む（ポップ感）
      const pop = k < 0.16 ? 1 + (1 - k / 0.16) * (t.scale - 1) : 1 - k * 0.12;
      const a = k > 0.7 ? 1 - (k - 0.7) / 0.3 : 1;
      ctx.globalAlpha = a;
      ctx.font = `${t.bold ? '900' : '700'} ${t.size * pop}px ui-rounded, "Arial Black", Impact, system-ui, sans-serif`;
      if (t.shadow) {
        ctx.lineWidth = Math.max(3, t.size * pop * 0.16);
        ctx.strokeStyle = 'rgba(0,0,0,.85)';
        ctx.lineJoin = 'round';
        ctx.strokeText(t.str, t.x, t.y);
      }
      ctx.fillStyle = t.color;
      ctx.fillText(t.str, t.x, t.y);
    }
    ctx.restore();
  }

  drawFlash(ctx, w, h) {
    if (this.flash.a <= 0.001) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = this.flash.a;
    ctx.fillStyle = this.flash.color;
    ctx.fillRect(0, 0, w, h);
    ctx.restore();
  }
}

// ============================================================
// エンティティ: 敵 / コイン
// ============================================================



class Enemy {
  constructor(type, x, y, hpScale = 1, opts = {}) {
    const d = CFG.enemies[type];
    this.type = type;
    this.def = d;
    this.x = x; this.y = y;
    this.r = d.r * (opts.sizeMul || 1);
    this.maxHp = Math.max(1, Math.round(d.hp * hpScale * (opts.hpMul || 1)));
    this.hp = this.maxHp;
    this.speed = d.speed * rand(0.85, 1.15) * (opts.speedMul || 1);
    this.color = d.color;
    this.sides = d.sides;
    this.angle = rand(TAU);
    this.spin = rand(-1.6, 1.6);
    this.kx = 0; this.ky = 0;      // ノックバック速度
    this.hitFlash = 0;
    this.squash = 0;
    this.dead = false;
    this.spawnT = 0;
    this.isBoss = type === 'boss';
    this.isChest = type === 'chest';
    this.reached = false;
    this.charm = 0;                // ブラックホール引き寄せ
  }

  update(dt, cx, cy) {
    this.spawnT += dt;
    const dx = cx - this.x, dy = cy - this.y;
    const dist = Math.hypot(dx, dy) || 1;
    const sp = this.speed;
    this.x += (dx / dist) * sp * dt;
    this.y += (dy / dist) * sp * dt;

    this.x += this.kx * dt;
    this.y += this.ky * dt;
    const damp = Math.max(0, 1 - 7 * dt);
    this.kx *= damp; this.ky *= damp;

    this.angle += this.spin * dt;
    this.hitFlash = Math.max(0, this.hitFlash - dt * 6);
    this.squash = Math.max(0, this.squash - dt * 5.5);
  }

  hit(dmg, fromX, fromY, knock) {
    this.hp -= dmg;
    this.hitFlash = 1;
    this.squash = 1;
    const a = Math.atan2(this.y - fromY, this.x - fromX);
    const k = knock / (1 + this.r * 0.02) * (this.isBoss ? 0.25 : 1);
    this.kx += Math.cos(a) * k;
    this.ky += Math.sin(a) * k;
    if (this.hp <= 0) this.dead = true;
    return this.dead;
  }

  draw(ctx, time, lowGlow = false) {
    const appear = clamp(this.spawnT / 0.22, 0, 1);
    const sq = 1 + this.squash * 0.35;
    const sq2 = 1 - this.squash * 0.22;
    const r = this.r * appear;

    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    ctx.scale(sq, sq2);

    const hpRatio = this.hp / this.maxHp;

    // グロー（大量に出るので薄く。積み重なると画面が白飛びする）
    if (!lowGlow || this.hitFlash > 0.2 || this.r > 22) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = (lowGlow ? 0.07 : 0.13) + this.hitFlash * 0.45;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      poly(ctx, 0, 0, r * 1.3, this.sides);
      ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.globalAlpha = 1;

    // 本体
    ctx.beginPath();
    poly(ctx, 0, 0, r, this.sides);
    ctx.fillStyle = this.hitFlash > 0.35 ? '#ffffff' : shade(this.color, 0.16 + hpRatio * 0.2);
    ctx.fill();
    ctx.lineWidth = this.isBoss ? 5 : 2.5;
    ctx.strokeStyle = this.hitFlash > 0.2 ? '#ffffff' : this.color;
    ctx.stroke();

    // 内側コア（HP表現）
    if (this.maxHp > 1) {
      ctx.beginPath();
      poly(ctx, 0, 0, r * 0.52 * hpRatio, this.sides);
      ctx.fillStyle = this.color;
      ctx.globalAlpha = 0.9;
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    if (this.isChest) {
      ctx.fillStyle = '#3a2a00';
      ctx.fillRect(-r * 0.6, -r * 0.12, r * 1.2, r * 0.24);
    }

    ctx.restore();

    // ボスHPバー
    if (this.isBoss) {
      const w = this.r * 2.4;
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,.55)';
      ctx.fillRect(this.x - w / 2, this.y - this.r - 20, w, 8);
      ctx.fillStyle = '#ff4d4d';
      ctx.fillRect(this.x - w / 2, this.y - this.r - 20, w * hpRatio, 8);
      ctx.strokeStyle = 'rgba(255,255,255,.6)';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(this.x - w / 2, this.y - this.r - 20, w, 8);
      ctx.restore();
    }
  }
}

class Coin {
  constructor(x, y, value, target) {
    this.x = x; this.y = y;
    const a = rand(TAU), s = rand(90, 300);
    this.vx = Math.cos(a) * s; this.vy = Math.sin(a) * s - 90;
    this.value = value;
    this.t = 0;
    this.delay = rand(0.12, 0.34);
    this.target = target;
    this.dead = false;
    this.r = 6.5;
    this.spin = rand(TAU);
  }

  update(dt, magnet) {
    this.t += dt;
    this.spin += dt * 9;
    if (this.t < this.delay) {
      this.vy += 900 * dt;
      this.x += this.vx * dt; this.y += this.vy * dt;
      this.vx *= Math.max(0, 1 - 3 * dt);
    } else {
      const dx = this.target.x - this.x, dy = this.target.y - this.y;
      const d = Math.hypot(dx, dy) || 1;
      const sp = (620 + (this.t - this.delay) * 2100) * magnet;
      this.x += (dx / d) * sp * dt;
      this.y += (dy / d) * sp * dt;
      if (d < 26) this.dead = true;
    }
  }

  draw(ctx) {
    const s = Math.abs(Math.cos(this.spin)) * 0.75 + 0.25;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.scale(s, 1);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#ffcf3f';
    ctx.beginPath(); ctx.arc(0, 0, this.r * 2.1, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#ffd94a';
    ctx.beginPath(); ctx.arc(0, 0, this.r, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#fff3b0'; ctx.lineWidth = 1.6; ctx.stroke();
    ctx.restore();
  }
}

function poly(ctx, x, y, r, sides) {
  if (sides < 3) { ctx.arc(x, y, r, 0, TAU); return; }
  for (let i = 0; i < sides; i++) {
    const a = (i / sides) * TAU - Math.PI / 2;
    const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
}

// hex色を暗くする（背景に沈める用）
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return `rgb(${Math.round(r * k)},${Math.round(g * k)},${Math.round(b * k)})`;
}

// レベルが上がるほど上位レアリティが出やすくなる
function rarityWeight(rarity, level, luck) {
  switch (rarity) {
    case 'COMMON':    return Math.max(22, 100 - level * 5.5);
    case 'RARE':      return 44 + level * 1.4;
    case 'EPIC':      return 9 + level * 2.3 + luck * 4;
    case 'LEGENDARY': return clamp(1.2 + level * 0.85 + luck * 2.2, 0, 18);
    default:          return 1;
  }
}

/**
 * 3枚のカードを抽選する。
 * 同一カードは重複しない / 上限に達したものは除外。
 */
function rollChoices(taken, level, luck = 0, n = 3) {
  const pool = UPGRADES.filter((u) => (taken[u.id] || 0) < u.max);
  const out = [];
  const used = new Set();
  for (let i = 0; i < n && pool.length; i++) {
    const cand = pool.filter((u) => !used.has(u.id));
    if (!cand.length) break;
    const u = weighted(cand, (x) => rarityWeight(x.r, level, luck));
    used.add(u.id);
    out.push(u);
  }
  return out;
}

function rarityInfo(r) { return RARITY[r]; }
const RARITY_ORDER = ['COMMON', 'RARE', 'EPIC', 'LEGENDARY'];

    mods: {},
    sub: '宝箱を壊せ',
  },
};

const LIST = Object.values(EVENTS);

class EventManager {
  constructor() { this.reset(); }

  reset() {
    this.active = [];          // {def, t}
    this.pending = null;       // {def, t}  予告中
    this.nextAt = 11;          // 最初のイベント
    this.time = 0;
    this.count = 0;
    this.lastKey = null;
  }

  update(dt, game) {
    this.time += dt;

    // 予告カウントダウン
    if (this.pending) {
      this.pending.t -= dt;
      const sec = Math.ceil(this.pending.t);
      if (sec !== this.pending.lastSec) {
        this.pending.lastSec = sec;
        if (sec > 0) game.onEventWarnTick(this.pending.def, sec);
      }
      if (this.pending.t <= 0) {
        const def = this.pending.def;
        this.pending = null;
        this.trigger(def, game);
      }
    } else if (this.time >= this.nextAt) {
      const def = this.roll();
      this.pending = { def, t: 3, lastSec: 99 };
      this.nextAt = this.time + rand(13, 19);
      game.onEventWarn(def);
    }

    // アクティブイベント
    for (let i = this.active.length - 1; i >= 0; i--) {
      const a = this.active[i];
      a.t -= dt;
      if (a.t <= 0) {
        this.active.splice(i, 1);
        game.onEventEnd(a.def);
      }
    }
  }

  roll() {
    const cand = LIST.filter((e) => e.key !== this.lastKey);
    const def = weighted(cand);
    this.lastKey = def.key;
    return def;
  }

  trigger(def, game) {
    this.count++;
    if (def.dur > 0) this.active.push({ def, t: def.dur });
    game.onEventStart(def);
  }

  /** 現在有効な修正値をまとめて返す */
  mods() {
    const m = { coinMul: 1, scoreMul: 1, critAdd: 0, spawnMul: 1, hpMul: 1, dropAll: 0, meteor: 0 };
    for (const a of this.active) {
      const s = a.def.mods;
      if (s.coinMul) m.coinMul *= s.coinMul;
      if (s.scoreMul) m.scoreMul *= s.scoreMul;
      if (s.critAdd) m.critAdd += s.critAdd;
      if (s.spawnMul) m.spawnMul *= s.spawnMul;
      if (s.hpMul) m.hpMul *= s.hpMul;
      if (s.dropAll) m.dropAll = 1;
      if (s.meteor) m.meteor = 1;
    }
    return m;
  }

  /** HUD 用: 一番目立たせたい "もうすぐ何か起きる" 情報 */
  hudHint() {
    if (this.pending) return { label: this.pending.def.label, sec: Math.ceil(this.pending.t), color: this.pending.def.color };
    return null;
  }

  activeLabels() {
    return this.active.map((a) => ({ label: a.def.label, color: a.def.color, t: a.t, dur: a.def.dur }));
  }
}

  { id: 'greed', icon: '🪙', name: 'GREED',      desc: 'コイン +25%',     max: 5, cost: (l) => 150 * Math.pow(2, l) },
];

const DEFAULT = {
  coins: 0,
  best: 0,
  bestCombo: 0,
  bestLevel: 0,
  bestDestroyed: 0,
  runs: 0,
  muted: false,
  up: {},
};

const Meta = {
  data: { ...DEFAULT },

  load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) this.data = { ...DEFAULT, ...JSON.parse(raw), up: { ...JSON.parse(raw).up } };
    } catch (e) { this.data = { ...DEFAULT }; }
    return this.data;
  },

  save() {
    try { localStorage.setItem(KEY, JSON.stringify(this.data)); } catch (e) { /* noop */ }
  },

  lv(id) { return this.data.up[id] || 0; },

  costOf(id) {
    const u = META_UPGRADES.find((x) => x.id === id);
    const l = this.lv(id);
    return l >= u.max ? null : Math.floor(u.cost(l));
  },

  canBuy(id) {
    const c = this.costOf(id);
    return c !== null && this.data.coins >= c;
  },

  buy(id) {
    const c = this.costOf(id);
    if (c === null || this.data.coins < c) return false;
    this.data.coins -= c;
    this.data.up[id] = this.lv(id) + 1;
    this.save();
    return true;
  },

  addCoins(n) { this.data.coins += n; },

  /** 1プレイ結果を記録し、更新内容を返す */
  submit(res) {
    const d = this.data;
    const out = {
      newBest: res.score > d.best,
      prevBest: d.best,
      newCombo: res.maxCombo > d.bestCombo,
      newDestroyed: res.destroyed > d.bestDestroyed,
    };
    d.runs++;
    d.best = Math.max(d.best, res.score);
    d.bestCombo = Math.max(d.bestCombo, res.maxCombo);
    d.bestLevel = Math.max(d.bestLevel, res.level);
    d.bestDestroyed = Math.max(d.bestDestroyed, res.destroyed);
    this.save();
    return out;
  },
};

// ============================================================
// UI レイヤー（DOM）
// Canvas は世界、DOM は HUD。数字はとにかくデカく。
// ============================================================






const $ = (id) => document.getElementById(id);
const fmt = (n) => Math.floor(n).toLocaleString('en-US');

class UI {
  constructor() {
    this.el = {
      hud: $('hud'),
      score: $('score'), best: $('best'),
      timeFill: $('timeFill'), timeNum: $('timeNum'),
      hpFill: $('hpFill'),
      comboWrap: $('comboWrap'), comboNum: $('comboNum'), comboMul: $('comboMul'),
      lvNum: $('lvNum'), xpFill: $('xpFill'),
      feverFill: $('feverFill'), feverRow: $('feverRow'), feverLabel: $('feverLabel'),
      banner: $('banner'), warn: $('warn'),
      title: $('title'), titleBest: $('titleBest'), titleCoins: $('titleCoins'),
      levelup: $('levelup'), cards: $('cards'), lvTitle: $('lvTitle'),
      result: $('result'), rScore: $('rScore'), rHook: $('rHook'), rGrid: $('rGrid'),
      rBest: $('rBest'), retry: $('retry'), shop: $('shop'), shopCoins: $('shopCoins'),
      mute: $('mute'),
    };
    this.lastCombo = -1;
    this.bannerT = 0;
    this.warnT = 0;
  }

  // ------------------------------------------------------------------
  update(g) {
    const e = this.el;
    e.score.textContent = fmt(g.displayScore);

    const timeR = clamp(g.timeLeft / CFG.run.time, 0, 1);
    e.timeFill.style.transform = `scaleX(${timeR})`;
    e.timeFill.classList.toggle('low', g.timeLeft <= 10);
    e.timeNum.textContent = Math.ceil(g.timeLeft);
    e.timeNum.classList.toggle('low', g.timeLeft <= 10);

    e.hpFill.style.transform = `scaleX(${clamp(g.hp / g.maxHp, 0, 1)})`;
    e.hpFill.classList.toggle('low', g.hp / g.maxHp < 0.34);

    // コンボ
    if (g.combo !== this.lastCombo) {
      this.lastCombo = g.combo;
      const tier = CFG.comboTiers[g.comboTierIndex()];
      if (g.combo >= 2) {
        e.comboWrap.classList.add('on');
        e.comboNum.textContent = g.combo;
        e.comboMul.textContent = `x${tier.mul}`;
        e.comboWrap.style.setProperty('--cc', tierColor(g.comboTierIndex()));
        e.comboNum.classList.remove('pop');
        void e.comboNum.offsetWidth;
        e.comboNum.classList.add('pop');
      } else {
        e.comboWrap.classList.remove('on');
      }
    }
    // コンボ残量（切れそう感）
    if (g.combo >= 2) {
      e.comboWrap.style.setProperty('--ct', clamp(g.comboTimer / g.stats.comboTime, 0, 1));
    }

    e.lvNum.textContent = `LV ${g.level}`;
    e.xpFill.style.transform = `scaleX(${clamp(g.exp / g.expNeed, 0, 1)})`;

    const fr = g.inFever ? g.feverT / (CFG.fever.duration + g.stats.feverBonus) : g.fever / CFG.fever.max;
    e.feverFill.style.transform = `scaleX(${clamp(fr, 0, 1)})`;
    e.feverRow.classList.toggle('active', g.inFever);
    e.feverRow.classList.toggle('near', !g.inFever && fr > 0.75);
    e.feverLabel.textContent = g.inFever ? 'FEVER!!' : 'FEVER';

    // バナー / 予告の自動フェード
    if (this.bannerT > 0) {
      this.bannerT -= 1 / 60;
      if (this.bannerT <= 0) e.banner.classList.remove('on');
    }
  }

  // ------------------------------------------------------------------
  banner(text, color, sub = '') {
    const e = this.el.banner;
    e.innerHTML = `<div class="bt">${text}</div>${sub ? `<div class="bs">${sub}</div>` : ''}`;
    e.style.setProperty('--bc', color);
    e.classList.remove('on'); void e.offsetWidth; e.classList.add('on');
    this.bannerT = 1.6;
  }

  clearBannerIf() { /* バナーは時間で自動的に消える */ }

  warn(label, sec, color) {
    const e = this.el.warn;
    e.innerHTML = `<span class="wl">${label}</span><span class="wn">${sec}</span>`;
    e.style.setProperty('--wc', color);
    e.classList.add('on');
    e.classList.remove('tick'); void e.offsetWidth; e.classList.add('tick');
  }

  clearWarn() { this.el.warn.classList.remove('on'); }

  clearBanners() { this.el.banner.classList.remove('on'); this.el.warn.classList.remove('on'); }

  // ------------------------------------------------------------------
  showTitle(g) {
    this.el.title.classList.add('on');
    this.el.hud.classList.remove('on');
    this.el.titleBest.textContent = `BEST  ${fmt(Meta.data.best)}`;
    this.el.titleCoins.textContent = `🪙 ${fmt(Meta.data.coins)}`;
  }

  hideTitle() {
    this.el.title.classList.remove('on');
    this.el.hud.classList.add('on');
  }

  // ------------------------------------------------------------------
  showCards(choices, hasLegend, onPick) {
    const wrap = this.el.cards;
    wrap.innerHTML = '';
    this.el.lvTitle.textContent = 'LEVEL UP!';
    this.el.levelup.classList.toggle('legend', hasLegend);
    choices.forEach((u, i) => {
      const r = RARITY[u.r];
      const card = document.createElement('button');
      card.className = `card r-${u.r}`;
      card.style.setProperty('--rc', r.color);
      card.style.setProperty('--rg', r.glow);
      card.style.animationDelay = `${i * 70}ms`;
      const lvl = 0;
      card.innerHTML = `
        <div class="crar">${r.name}</div>
        <div class="cicon">${u.icon}</div>
        <div class="cbody">
          <div class="cname">${u.name}</div>
          <div class="cdesc">${u.desc}</div>
        </div>
        <div class="cglow"></div>`;
      card.addEventListener('pointerdown', (ev) => {
        ev.preventDefault();
        ev.stopPropagation();
        if (this._picking) return;
        this._picking = true;
        card.classList.add('picked');
        setTimeout(() => { this._picking = false; onPick(u); }, 110);
      });
      wrap.appendChild(card);
    });
    this.el.levelup.classList.add('on');
  }

  hideCards() { this.el.levelup.classList.remove('on'); }

  // ------------------------------------------------------------------
  showResult(res, info, g) {
    const e = this.el;
    e.rScore.textContent = fmt(res.score);
    e.rGrid.innerHTML = [
      ['MAX COMBO', `x${res.maxCombo}`, info.newCombo],
      ['DESTROYED', fmt(res.destroyed), info.newDestroyed],
      ['LEVEL', res.level, false],
      ['COINS', `🪙 ${fmt(res.coins)}`, false],
    ].map(([k, v, isNew]) => `
      <div class="rcell${isNew ? ' new' : ''}">
        <div class="rk">${k}</div>
        <div class="rv">${v}</div>
        ${isNew ? '<div class="rnew">NEW!</div>' : ''}
      </div>`).join('');

    e.rBest.textContent = `BEST  ${fmt(Meta.data.best)}`;

    // ---- もう一度やりたくなる一言 ----
    let hook, cls = '';
    if (info.newBest) { hook = '🎉 NEW BEST SCORE!!'; cls = 'best'; }
    else if (info.prevBest > 0) {
      const pct = ((info.prevBest - res.score) / info.prevBest) * 100;
      if (pct <= 3) { hook = `自己ベストまで あと ${pct.toFixed(1)}% !!`; cls = 'close'; }
      else if (pct <= 15) { hook = `自己ベストまで あと ${Math.ceil(pct)}%`; cls = 'close'; }
      else if (info.newCombo) hook = '🔥 過去最高コンボ更新!';
      else hook = `あと ${fmt(info.prevBest - res.score)} でベスト更新`;
    } else hook = '次はもっと壊せる';
    e.rHook.textContent = hook;
    e.rHook.className = `rhook ${cls}`;

    this.renderShop(g);
    e.result.classList.add('on');
    e.hud.classList.remove('on');
  }

  hideResult() { this.el.result.classList.remove('on'); }

  renderShop(g) {
    const e = this.el;
    e.shopCoins.textContent = `🪙 ${fmt(Meta.data.coins)}`;
    e.shop.innerHTML = '';
    META_UPGRADES.forEach((u) => {
      const lv = Meta.lv(u.id);
      const cost = Meta.costOf(u.id);
      const can = Meta.canBuy(u.id);
      const b = document.createElement('button');
      b.className = `shopitem${cost === null ? ' maxed' : can ? ' can' : ''}`;
      b.innerHTML = `
        <div class="si-icon">${u.icon}</div>
        <div class="si-main">
          <div class="si-name">${u.name}</div>
          <div class="si-desc">${u.desc}</div>
          <div class="si-dots">${Array.from({ length: u.max }, (_, i) => `<i class="${i < lv ? 'on' : ''}"></i>`).join('')}</div>
        </div>
        <div class="si-cost">${cost === null ? 'MAX' : `🪙${fmt(cost)}`}</div>`;
      b.addEventListener('pointerdown', (ev) => {
        ev.preventDefault(); ev.stopPropagation();
        if (Meta.buy(u.id)) { SFX.pickup(2); this.renderShop(g); }
        else SFX.warn();
      });
      e.shop.appendChild(b);
    });
  }
}

function tierColor(i) {
  return ['#ffffff', '#7fe9ff', '#7dff9b', '#ffe14d', '#ff8a3d', '#ff5aa8', '#c07bff', '#ffcf3f'][i] || '#fff';
}
